<!doctype html>
<!-- Página usada só para gerar os ícones PNG (tools/make_icons.ps1). Parâmetro ?h=altura do logo em % -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:radial-gradient(circle at 50% 38%,#1b1b1f 0%,#0b0b0c 70%);display:flex;align-items:center;justify-content:center}
img{height:var(--h,58%);width:auto;filter:drop-shadow(0 2px 8px rgba(0,0,0,.6))}
</style></head><body>
<img src="../assets/logo-mk.svg" alt="">
<script>const h=new URLSearchParams(location.search).get('h');if(h)document.body.style.setProperty('--h',h+'%');</script>
</body></html>
